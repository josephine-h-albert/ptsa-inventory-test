<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoHS PTSA Inventory</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<style>
  body { font-family: -apple-system, Roboto, Arial, sans-serif; margin: auto; padding: 16px; max-width: 480px; }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; margin-top: 24px; }
  button { font-size: 17px; padding: 12px 16px; margin: 4px 0; width: 100%; border-radius: 8px;
           border: 1px solid #1a3a7a; background: #1a3a7a; color: #fff; }
  button.secondary { background: #fff; color: #1a3a7a; }
  button:disabled { opacity: .4; }
  input:not([type=radio]) { font-size: 17px; padding: 10px; width: 100%; box-sizing: border-box; margin: 4px 0; }
  #modes label { display: inline-block; margin-right: 16px; font-size: 17px; }
  #reader { width: 100%; margin: 8px 0; }
  #status { padding: 12px; border-radius: 8px; background: #eef3ff; margin: 8px 0; min-height: 24px;
            position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  #status.err { background: #ffe8e8; }
  #status.ok { background: #e2f0d9; }
  #donate, #newitem { border: 2px solid #b35900; border-radius: 8px; padding: 12px; margin: 8px 0; background: #fff6ea; }
  .sug { margin: 2px 0 6px; }
  button.chip { display: inline-block; width: auto; margin: 2px 6px 2px 0; padding: 6px 12px; font-size: 15px;
                border-radius: 16px; background: #eef3ff; color: #1a3a7a; text-align: left; white-space: normal; }
  #sessionLog { max-height: 220px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; }
  #sessionLog .row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0;
                      border-bottom: 1px solid #eee; font-size: 15px; }
  #sessionLog .row:last-child { border-bottom: none; }
  #sessionLog .name { flex: 1; }
  #sessionLog .amt { font-weight: bold; white-space: nowrap; }
  #sessionLog .amt.neg { color: #b35900; }
  #sessionEmpty { color: #888; font-size: 14px; }
  details { margin: 8px 0; }
</style>
</head>
<body>

<h1>HoHS PTSA Inventory</h1>

<details id="settings" open>
  <summary>Setup (once per phone)</summary>
  <input id="who" placeholder="Your name (optional)">
  <input id="pin" type="password" placeholder="PIN">
  <button class="secondary" onclick="saveSettings()">Save</button>
</details>

<div id="modes">
  <label><input type="radio" name="mode" value="add" checked onchange="setMode('add')"> Add to inventory</label>
  <label><input type="radio" name="mode" value="donate" onchange="setMode('donate')"> Donate</label>
</div>

<div id="status">Ready. ADD mode.</div>

<div id="donate" hidden>
  <strong id="dname"></strong><br>
  <span id="dhand"></span>
  <input id="dqty" type="number" min="1" inputmode="numeric" placeholder="Quantity">
  <input id="drecipient" placeholder="Recipient (required)" autocomplete="off">
  <div id="recSug" class="sug"></div>
  <input id="dnotes" placeholder="Notes (optional)">
  <button onclick="confirmDonation()">Confirm donation</button>
  <button class="secondary" onclick="cancelDonation()">Cancel</button>
</div>

<div id="newitem" hidden>
  <strong>New item. Confirm or edit the name:</strong>
  <input id="nname" placeholder="Brand, product, size (e.g. Oreo snack packs, 30 ct box)">
  <div id="nnameWarn" style="font-size:14px; color:#b35900; margin:2px 0 6px;"></div>
  <button onclick="confirmNew()">Save item (+1)</button>
  <button class="secondary" onclick="cancelNew()">Cancel</button>
</div>

<button id="start" onclick="startScan()">Start scanning</button>
<button id="stop" class="secondary" onclick="stopScan()" disabled>Stop scanning</button>
<div id="reader"></div>
<p id="tip" hidden style="font-size:14px; color:#555; margin:2px 0 8px;">
  Hold about 4-6 inches away, fill the box with the barcode, and hold steady for a second. More light helps.
</p>
<button id="torch" class="secondary" onclick="toggleTorch()" hidden>Turn flashlight on</button>
<button id="undo" class="secondary" onclick="undo()" disabled>Undo last entry</button>

<h2>This session <span id="sessionCount" style="font-weight:normal; font-size:14px; color:#666;"></span></h2>
<div id="sessionLog"><div id="sessionEmpty">Nothing scanned yet.</div></div>

<h2>No barcode?</h2>
<input id="manual" placeholder="Item name" autocomplete="off">
<div id="manualSug" class="sug"></div>
<input id="mqty" type="number" min="1" value="1" inputmode="numeric" placeholder="Quantity">
<button id="manualBtn" class="secondary" onclick="manualEntry()">Add without barcode</button>
<button id="manualForceNewBtn" class="secondary" hidden onclick="forceNewManual()">This is different, add as a new item</button>

<details id="renameSection">
  <summary>Fix a typo in an item's name</summary>
  <input id="rOld" placeholder="Current name (pick from the list below)" autocomplete="off">
  <div id="rOldSug" class="sug"></div>
  <input id="rNew" placeholder="Corrected name">
  <button class="secondary" onclick="doRename()">Rename everywhere</button>
</details>

<script>
// The web app URL now lives in config.js (uploaded once, edited only when the backend URL changes)

const $ = id => document.getElementById(id);
let scanner = null;
let busy = false;
let mode = 'add';
let pending = null;          // donation waiting for confirmation
let pendingAdd = null;       // new item waiting for a name
let itemList = [];           // every current item {upc, name}, for "No barcode?" adds and the rename picker
let recipientNames = [];     // suggestions for donation recipients
let sessionLog = [];         // this phone's actions since the page was opened (not saved anywhere)
let allNames = [];           // just the names from itemList, for the suggestion boxes
let manualForceNew = null;   // exact text the volunteer has explicitly confirmed as a new item
let torchOn = false;
let lastScan = { code: '', t: 0 };
let lastAction = null;

const pin = () => localStorage.getItem('pin') || '';
const who = () => localStorage.getItem('who') || '';

$('pin').value = pin();
$('who').value = who();
if (pin()) { $('settings').open = false; loadRecipients(); loadAllNames(); }

// Tappable suggestions (more reliable on phones than the browser's built-in dropdown)
function suggest(inputId, boxId, list) {
  const box = $(boxId);
  const q = $(inputId).value.trim().toLowerCase();
  const matches = list
    .filter(n => n.toLowerCase().indexOf(q) !== -1 && n.toLowerCase() !== q)
    .slice(0, 6);
  box.innerHTML = '';
  matches.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = n;
    b.onclick = () => { $(inputId).value = n; box.innerHTML = ''; };
    box.appendChild(b);
  });
}

[['manual', 'manualSug', () => allNames], ['drecipient', 'recSug', () => recipientNames], ['rOld', 'rOldSug', () => allNames]].forEach(cfg => {
  $(cfg[0]).addEventListener('input', () => suggest(cfg[0], cfg[1], cfg[2]()));
  $(cfg[0]).addEventListener('focus', () => suggest(cfg[0], cfg[1], cfg[2]()));
});

$('manual').addEventListener('input', () => {
  manualForceNew = null;
  $('manualForceNewBtn').hidden = true;
});

function show(msg, isErr, ok) {
  $('status').textContent = msg;
  $('status').className = isErr ? 'err' : (ok ? 'ok' : '');
}

function saveSettings() {
  localStorage.setItem('pin', $('pin').value.trim());
  localStorage.setItem('who', $('who').value.trim());
  show('Saved.');
  loadRecipients();
  loadAllNames();
}

function setMode(m) {
  mode = m;
  cancelDonation(true);
  cancelNew(true);
  manualForceNew = null;
  $('manualForceNewBtn').hidden = true;
  $('manualBtn').textContent = m === 'donate' ? 'Donate without barcode' : 'Add without barcode';
  $('mqty').hidden = m === 'donate';
  show(m === 'donate' ? 'DONATE mode: scanned items leave inventory.' : 'ADD mode: scanned items are added.');
}

// A stalled connection with no timeout leaves the page frozen forever with no error and
// no way to recover except reloading. This aborts a request that's gone quiet for too long
// and turns it into a normal, catchable error instead.
async function fetchWithTimeout(url, options, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms || 15000);
  try {
    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  } catch (err) {
    if (err.name === 'AbortError') throw new Error('Network problem: no response after 15 seconds. Check your connection and try again.');
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

async function api(body) {
  const r = await fetchWithTimeout(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ pin: pin(), who: who() }, body))
  });
  return r.json();
}

async function get(params) {
  const q = new URLSearchParams(Object.assign({ pin: pin() }, params));
  const r = await fetchWithTimeout(SCRIPT_URL + '?' + q.toString());
  return r.json();
}

async function loadRecipients() {
  try {
    const r = await get({ action: 'recipients' });
    recipientNames = r.names || [];
  } catch (e) {}
}

async function loadAllNames() {
  try {
    const r = await get({ action: 'allnames' });
    itemList = r.items || [];
    allNames = itemList.map(i => i.name);
  } catch (e) {}
}

async function guessName(upc) {
  try {
    const r = await fetchWithTimeout('https://world.openfoodfacts.org/api/v2/product/' + upc + '.json?fields=product_name,brands', {}, 8000);
    const j = await r.json();
    if (j.status === 1 && j.product) {
      return [j.product.brands, j.product.product_name].filter(Boolean).join(' ').trim();
    }
  } catch (e) {}
  return '';
}

function renderSession() {
  const box = $('sessionLog');
  $('sessionCount').textContent = sessionLog.length ? '(' + sessionLog.length + ')' : '';
  if (!sessionLog.length) { box.innerHTML = '<div id="sessionEmpty">Nothing scanned yet.</div>'; return; }
  box.innerHTML = sessionLog.slice().reverse().map(e => {
    const cls = e.delta < 0 ? 'amt neg' : 'amt';
    const sign = e.delta > 0 ? '+' + e.delta : String(e.delta);
    const tag = e.type === 'donation' ? ' (donated)' : e.type === 'undo' ? ' (undo)' : '';
    return '<div class="row"><span class="name">' + e.name.replace(/</g, '&lt;') + '</span>' +
           '<span class="' + cls + '">' + sign + tag + '</span></div>';
  }).join('');
}

async function record(upc, name, delta, type, recipient, comments) {
  const r = await api({ upc: upc, name: name, delta: delta, type: type, recipient: recipient, comments: comments });
  if (r.error) throw new Error(r.error);
  lastAction = type === 'undo' ? null : { upc: r.upc, name: r.name, delta: delta, recipient: recipient };
  $('undo').disabled = !lastAction;
  const verb = type === 'donation' ? 'Donated ' + (-delta) + ': ' : type === 'undo' ? 'Undone: ' : 'Added ' + delta + ': ';
  show(verb + r.name + '  |  On hand: ' + r.quantity, false, true);
  sessionLog.push({ name: r.name, delta: delta, type: type });
  renderSession();
  return r;
}

async function beginDonation(upc) {
  show('Checking ' + upc + '...');
  const k = await get({ upc: upc });
  if (k.error) throw new Error(k.error);
  if (!k.onHand || k.onHand < 1) {
    show((k.name || 'That item') + ' has nothing on hand. Nothing to donate.', true);
    return;
  }
  pending = { upc: upc, name: k.name || upc, onHand: k.onHand };
  $('dname').textContent = pending.name;
  $('dhand').textContent = 'On hand: ' + k.onHand;
  $('dqty').value = 1;
  $('dqty').max = k.onHand;
  $('drecipient').value = '';
  $('dnotes').value = '';
  suggest('drecipient', 'recSug', recipientNames);
  $('donate').hidden = false;
  show('Set quantity and recipient, then confirm.');
}

async function confirmDonation() {
  if (!pending || busy) return;
  const qty = parseInt($('dqty').value, 10);
  if (!qty || qty < 1 || qty > pending.onHand) {
    show('Quantity must be between 1 and ' + pending.onHand + '.', true);
    return;
  }
  const recipient = $('drecipient').value.trim();
  if (!recipient) { show('Enter a recipient.', true); return; }
  busy = true;
  try {
    await record(pending.upc, pending.name, -qty, 'donation', recipient, $('dnotes').value.trim());
    pending = null;
    $('donate').hidden = true;
    loadRecipients();
  } catch (err) {
    show('Error: ' + err.message, true);
  } finally {
    busy = false;
  }
}

function cancelDonation(silent) {
  pending = null;
  $('donate').hidden = true;
  if (!silent) show('Cancelled. Nothing recorded.');
}

async function confirmNew() {
  if (!pendingAdd || busy) return;
  const name = $('nname').value.trim();
  if (!name) { show('Enter a name.', true); return; }
  busy = true;
  try {
    await record(pendingAdd.upc, name, 1, 'scan', '', '');
    pendingAdd = null;
    $('newitem').hidden = true;
  } catch (err) {
    show('Error: ' + err.message, true);
  } finally {
    busy = false;
  }
}

// Warns if the typed name is close to (but not exactly) an existing item's name, so a
// typo doesn't quietly drift from your naming convention. This scanned barcode is a real,
// distinct item and gets saved regardless; the warning is only about the spelling chosen.
function checkNewItemName() {
  const q = $('nname').value.trim().toLowerCase();
  if (!q) { $('nnameWarn').textContent = ''; return; }
  const match = itemList.find(i => i.name.toLowerCase().indexOf(q) !== -1 && i.name.trim().toLowerCase() !== q);
  $('nnameWarn').textContent = match ? 'Similar to an existing item: "' + match.name + '". Check the spelling matches on purpose.' : '';
}
$('nname').addEventListener('input', checkNewItemName);

function cancelNew(silent) {
  pendingAdd = null;
  $('newitem').hidden = true;
  $('nnameWarn').textContent = '';
  if (!silent) show('Cancelled. Nothing recorded.');
}

async function onScan(code) {
  const now = Date.now();
  if (busy || pending || pendingAdd || (code === lastScan.code && now - lastScan.t < 4000)) return;
  busy = true;
  lastScan = { code: code, t: now };
  try {
    if (mode === 'donate') { await beginDonation(code); return; }
    show('Looking up ' + code + '...');
    const k = await get({ upc: code });
    if (k.error) throw new Error(k.error);
    let name = k.name;
    if (!name) {
      const guess = await guessName(code);
      pendingAdd = { upc: code };
      $('nname').value = guess;
      $('newitem').hidden = false;
      checkNewItemName();
      show('New item. Confirm or edit the name, then tap Save item.');
      return;
    }
    const r = await record(code, name.trim(), 1, 'scan', '', '');
    show('Recognized item: ' + r.name + '. Count is now ' + r.quantity + ' (was ' + (r.quantity - 1) + ').', false, true);
  } catch (err) {
    show('Error: ' + err.message, true);
  } finally {
    busy = false;
  }
}

async function undo() {
  if (!lastAction || busy || pending || pendingAdd) return;
  busy = true;
  try {
    await record(lastAction.upc, lastAction.name, -lastAction.delta, 'undo', lastAction.recipient, '');
  } catch (err) {
    show('Error: ' + err.message, true);
  } finally {
    busy = false;
  }
}

async function doRename() {
  const oldName = $('rOld').value.trim();
  const newName = $('rNew').value.trim();
  if (!oldName || !newName) { show('Enter both the current and corrected name.', true); return; }
  if (busy) return;
  busy = true;
  try {
    const r = await api({ type: 'rename', oldName: oldName, newName: newName });
    if (r.error) throw new Error(r.error);
    show('Renamed ' + r.renamed + ' entr' + (r.renamed === 1 ? 'y' : 'ies') + ' to "' + r.name + '".', false, true);
    $('rOld').value = '';
    $('rNew').value = '';
    $('rOldSug').innerHTML = '';
    loadAllNames();
  } catch (err) {
    show('Error: ' + err.message, true);
  } finally {
    busy = false;
  }
}

// Finds an existing item by name (case-insensitive, exact match) so a "no barcode" add
// or donation attaches to the item already in Inventory instead of creating a duplicate.
// Only creates a new manual entry when no existing item matches the typed name.
// Checks a typed name against every current item:
//  - exact  : an item whose name matches exactly (case/spacing aside) -> attach automatically
//  - partial: one or more items whose name contains the typed text, but nothing exact ->
//             ambiguous; the volunteer must pick one or explicitly confirm it's new
//  - neither: nothing similar exists -> safe to create as a new item automatically
function resolveItem(name) {
  const q = name.trim().toLowerCase();
  const exact = itemList.find(i => i.name.trim().toLowerCase() === q);
  if (exact) return { status: 'exact', item: exact };

  const partial = itemList.filter(i => i.name.toLowerCase().indexOf(q) !== -1);
  if (partial.length) return { status: 'partial', matches: partial };

  const id = 'M-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return { status: 'new', item: { upc: id, name: name.trim() } };
}

function forceNewManual() {
  manualForceNew = $('manual').value.trim();
  $('manualForceNewBtn').hidden = true;
  manualEntry();
}

async function manualEntry() {
  const typed = $('manual').value.trim();
  if (!typed || busy || pending || pendingAdd) return;

  const r = resolveItem(typed);
  let item;
  if (r.status === 'exact') {
    item = r.item;
  } else if (r.status === 'partial' && manualForceNew !== typed) {
    const names = r.matches.slice(0, 6).map(i => i.name).join('; ');
    show(r.matches.length + ' similar item' + (r.matches.length > 1 ? 's' : '') +
         ' already in inventory: ' + names + '. Tap one above to add to it, or confirm this is different.', true);
    $('manualForceNewBtn').hidden = false;
    return;
  } else if (r.status === 'partial') {
    // Volunteer already tapped "This is different" for this exact text: create it as new.
    const id = 'M-' + typed.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    item = { upc: id, name: typed };
  } else {
    item = r.item;
  }

  manualForceNew = null;
  $('manualForceNewBtn').hidden = true;
  busy = true;
  try {
    if (mode === 'donate') {
      await beginDonation(item.upc);
      if (pending) $('manual').value = '';
    } else {
      const qty = parseInt($('mqty').value, 10);
      if (!qty || qty < 1 || qty > 1000) { show('Quantity must be between 1 and 1000.', true); return; }
      await record(item.upc, item.name, qty, 'scan', '', '');
      $('manual').value = '';
      $('manualSug').innerHTML = '';
      $('mqty').value = 1;
      loadAllNames();
    }
  } catch (err) {
    show('Error: ' + err.message, true);
  } finally {
    busy = false;
  }
}

async function startScan() {
  if (!pin()) { show('Enter the PIN under Setup first.', true); return; }
  try {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8
      ],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 15, qrbox: { width: 320, height: 160 } },
      onScan,
      function () {}
    );
    $('start').disabled = true;
    $('stop').disabled = false;
    $('tip').hidden = false;
    show('Point the camera at a barcode.');

    try {
      const caps = scanner.getRunningTrackCapabilities();
      $('torch').hidden = !(caps && caps.torch);
    } catch (e) {
      $('torch').hidden = true;
    }
  } catch (err) {
    show('Camera error: ' + err, true);
  }
}

async function stopScan() {
  try { await scanner.stop(); scanner.clear(); } catch (e) {}
  $('start').disabled = false;
  $('stop').disabled = true;
  $('tip').hidden = true;
  $('torch').hidden = true;
  $('torch').textContent = 'Turn flashlight on';
  torchOn = false;
  show('Scanner stopped.');
}

async function toggleTorch() {
  try {
    await scanner.applyVideoConstraints({ advanced: [{ torch: !torchOn }] });
    torchOn = !torchOn;
    $('torch').textContent = torchOn ? 'Turn flashlight off' : 'Turn flashlight on';
  } catch (e) {
    show('This phone does not support the flashlight toggle.', true);
    $('torch').hidden = true;
  }
}
</script>
</body>
</html>
